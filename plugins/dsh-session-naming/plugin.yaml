id: dsh-session-naming
name: Session Naming
version: "0.5.0"
spec_version: "1.0"
status: experimental
maintainers:
  - name: Neuvilette
    email: neuviletteflux@gmail.com
description: |
  DeepSeek Harness host plugin that makes the local session-naming convention
  the default behavior. It registers the agent-facing `set_session_title` and
  `rename_session` tools, then watches `session/title` and rewrites the
  built-in summary into `[Branch｜]MMDD｜类型｜目标` after the title settles.
  Provider-sourced revisions keep the title unpinned, so an agent can still
  correct the inferred type or goal; human titles, compliant titles, and
  subagent sessions are left untouched. A fork child that still carries the
  inherited `父标题 (n)` is rewritten to `Branch｜MMDD｜类型｜目标` with the
  ordinal removed, while a human rename on the fork is preserved. Titles come
  from the session's creation date and the service's 80-byte budget; no model
  call is added. A read-only `session_title_audit` reports compliance, branch,
  duplicate, and invalid-prefix counts without writing. A dry-run-first
  `session_title_backfill` proposes canonical titles for historical rows. The
  optional browser half adds a compact fork icon to Session rows.
tags: [dsh, deepseek-harness, plugin, session, naming, title, tools]
license: MIT
entrypoint: "lib/index.js"
dependencies: []
