id: dsh-session-naming
name: Session Naming
version: "0.1.0"
spec_version: "1.0"
status: experimental
maintainers:
  - name: Neuvilette
    email: neuviletteflux@gmail.com
description: |
  DeepSeek Harness host plugin that makes the local session-naming convention
  the default behavior. It registers the agent-facing `set_session_title` and
  `rename_session` tools, then watches `session/title` and rewrites the
  built-in summary into `[Branch｜]MMDD｜类型｜目标` after the title settles.
  Provider-sourced revisions keep the title unpinned, so an agent can still
  correct the inferred type or goal; human titles, compliant titles, subagent
  and fork sessions are left untouched. Titles come from the session's creation
  date and the service's 80-byte budget; no model call is added.
tags: [dsh, deepseek-harness, plugin, session, naming, title, tools]
license: MIT
entrypoint: "lib/index.js"
dependencies: []
