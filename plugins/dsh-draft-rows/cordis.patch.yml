# Mount dsh-draft-rows into a DSH profile.
#
# All behavior lives in the browser bundle declared by `dsh.client`; this layer
# only makes the package a loadable Profile Bundle:
#
#   dsh plugin --profile desktop add link:/path/to/dsh-draft-rows
#
- insert:
    - id: draft-rows
      name: 'dsh-draft-rows'
